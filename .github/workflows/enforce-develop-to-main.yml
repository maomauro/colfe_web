name: Enforce develop -> main

# GitHub no permite restringir de forma nativa desde qué rama puede abrirse un
# pull request. Este workflow lo reemplaza: falla si un PR contra main no viene
# de develop, y se marca como check obligatorio en la regla de protección de main.
# Flujo: feature -> develop -> main.

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    name: Verificar rama de origen
    runs-on: ubuntu-latest
    steps:
      - name: Solo se permite develop -> main
        if: github.event.pull_request.head.ref != 'develop'
        run: |
          echo "::error::Los pull requests hacia main solo pueden venir de la rama 'develop'. Rama detectada: ${{ github.event.pull_request.head.ref }}"
          exit 1
      - name: Origen válido
        if: github.event.pull_request.head.ref == 'develop'
        run: |
          echo "OK: el PR viene de develop."
