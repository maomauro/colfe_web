; Endurecimiento de PHP para COLFE. Se aplica sobre la configuración base de la imagen.
expose_php = Off
display_errors = Off
log_errors = On
; Si la app necesitara ejecutar comandos, hay que decidirlo explícitamente: hoy no se usa ninguno.
disable_functions = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec
allow_url_fopen = Off
allow_url_include = Off
memory_limit = 256M
max_execution_time = 60
post_max_size = 8M
upload_max_filesize = 5M
date.timezone = America/Bogota

; Sesiones (config.php también las fija)
session.use_strict_mode = 1
session.cookie_httponly = 1

; OPcache para producción
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
