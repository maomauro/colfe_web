# Ejemplo para el nginx DEL SERVIDOR (el contenedor portalcv-nginx-prod, que ya atiende 80/443).
# COLFE corre en Docker sin puertos publicados; el nginx del servidor lo alcanza por la red
# compartida (PROXY_NETWORK) con el nombre «colfe-web». Este bloque lo publica con HTTPS.
# Los certificados se montan DENTRO de ese contenedor (ajuste las rutas a lo que ya tenga montado).
# Ajuste server_name y las rutas del certificado (p. ej. certificado de origen de Cloudflare).

server {
    listen 80;
    server_name colfe.sitiosapps.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name colfe.sitiosapps.com;

    ssl_certificate     /etc/ssl/colfe/origin.pem;
    ssl_certificate_key /etc/ssl/colfe/origin.key;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 8m;

    location / {
        proxy_pass http://colfe-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Si hay Cloudflare delante, use su IP real en lugar de $remote_addr:
        #   proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
